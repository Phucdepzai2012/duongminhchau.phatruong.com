<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Website riêng của Trường THCS Dương Minh Châu">
  <title>Trường THCS Dương Minh Châu</title>
  <style>
    html,body{margin:0;padding:0;min-height:100%;font-family:Arial,sans-serif}
    #notice{position:sticky;top:0;z-index:2147483647;background:#123b63;color:#fff;padding:10px 14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:14px;line-height:1.45}
    #notice strong{font-weight:700}
    #notice button{margin-left:10px;border:0;border-radius:6px;padding:7px 11px;cursor:pointer;background:#fff;color:#123b63;font-weight:700}
    #status{position:fixed;right:12px;bottom:12px;z-index:2147483647;max-width:330px;background:rgba(0,0,0,.84);color:#fff;padding:9px 12px;border-radius:9px;font:12px/1.4 Arial,sans-serif}
    #app{min-height:calc(100vh - 44px)}
    #error{max-width:720px;margin:70px auto;padding:24px;text-align:center}
    #error h2{margin-top:0}
  </style>
</head>
<body>
  <div id="notice">
    <strong>TRƯỜNG THCS DƯƠNG MINH CHÂU</strong> — Trang hiển thị đồng bộ nội dung từ nguồn được cấu hình.
    <button id="refresh" type="button">↻ Cập nhật</button>
  </div>

  <div id="status">Đang đồng bộ nội dung…</div>
  <main id="app"></main>

<script>
(() => {
  'use strict';

  // ==============================
  // CẤU HÌNH
  // ==============================
  const SOURCE_URL = 'http://thcsngovanso.phuonglaocai.edu.vn/';
  const PROXY_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(SOURCE_URL);

  const SCHOOL_NAME = 'Trường THCS Dương Minh Châu';
  const PRINCIPAL_NAME = 'Nguyễn Xuân Phúc';

  // Các cách ghi tên cũ có thể xuất hiện trong HTML nguồn.
  const SCHOOL_REPLACEMENTS = [
    'Trường THCS Ngô Văn Sở',
    'THCS Ngô Văn Sở',
    'THCS NGÔ VĂN SỞ',
    'THCS Ngô Văn Sở.',
    'Ngô Văn Sở'
  ];

  // ==============================
  // HÀM TIỆN ÍCH
  // ==============================
  const statusEl = document.getElementById('status');
  const appEl = document.getElementById('app');
  const refreshBtn = document.getElementById('refresh');

  function setStatus(text, keep = true) {
    statusEl.textContent = text;
    statusEl.hidden = false;
    if (!keep) {
      setTimeout(() => statusEl.remove(), 5000);
    }
  }

  function replaceAllText(value) {
    let result = String(value ?? '');

    for (const oldName of SCHOOL_REPLACEMENTS) {
      result = result.split(oldName).join(SCHOOL_NAME);
    }

    // Một số kiểu mã hóa UTF-8 hoặc khác biệt Unicode.
    result = result.replace(/Phùng\s+Thị\s+Dung/gi, PRINCIPAL_NAME);
    result = result.replace(/Phùng\s+Thị\s+Dung/gi, PRINCIPAL_NAME);
    result = result.replace(/Phung\s+Thi\s+Dung/gi, PRINCIPAL_NAME);

    return result;
  }

  function absoluteUrl(value) {
    try {
      return new URL(value, SOURCE_URL).href;
    } catch {
      return value;
    }
  }

  function rewriteAssetUrls(doc) {
    // Tài nguyên tương đối cần trỏ về website nguồn.
    doc.querySelectorAll('[src]').forEach(el => {
      const src = el.getAttribute('src');
      if (!src || src.startsWith('#') || /^(data:|blob:|javascript:|mailto:|tel:)/i.test(src)) return;
      el.setAttribute('src', absoluteUrl(src));
    });

    doc.querySelectorAll('[href]').forEach(el => {
      const href = el.getAttribute('href');
      if (!href || href.startsWith('#') || /^(data:|javascript:|mailto:|tel:)/i.test(href)) return;
      // Giữ liên kết ngoài; chỉ đổi đường dẫn tương đối thành tuyệt đối.
      el.setAttribute('href', absoluteUrl(href));
    });

    doc.querySelectorAll('[srcset]').forEach(el => {
      const value = el.getAttribute('srcset');
      const rewritten = value.split(',').map(part => {
        const bits = part.trim().split(/\s+/);
        if (!bits[0]) return part;
        bits[0] = absoluteUrl(bits[0]);
        return bits.join(' ');
      }).join(', ');
      el.setAttribute('srcset', rewritten);
    });

    // CSS url(...) tương đối.
    doc.querySelectorAll('style').forEach(style => {
      style.textContent = style.textContent.replace(/url\((['"]?)(?!data:|https?:|\/\/|#)([^'"\)]+)\1\)/gi,
        (m, q, url) => `url(${q}${absoluteUrl(url)}${q})`);
    });
  }

  function replaceDocumentIdentity(doc) {
    const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      node.nodeValue = replaceAllText(node.nodeValue);
    }

    doc.querySelectorAll('title,meta[content],input[value],textarea').forEach(el => {
      if (el.hasAttribute('content')) el.setAttribute('content', replaceAllText(el.getAttribute('content')));
      if (el.hasAttribute('value')) el.setAttribute('value', replaceAllText(el.getAttribute('value')));
      if (el.tagName === 'TEXTAREA') el.value = replaceAllText(el.value);
    });

    if (doc.title) doc.title = replaceAllText(doc.title);
  }

  function disableDangerousDocumentFeatures(doc) {
    // Không cho tài liệu nguồn tự chuyển hướng hoặc thay đổi parent window.
    doc.querySelectorAll('base').forEach(el => el.remove());
    doc.querySelectorAll('meta[http-equiv="refresh" i]').forEach(el => el.remove());

    // Giữ trang ở chế độ hiển thị; không chuyển tiếp dữ liệu biểu mẫu.
    doc.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', e => {
        e.preventDefault();
        alert('Biểu mẫu đã được khóa trên trang đồng bộ này.');
      });
    });
  }

  async function fetchSource() {
    const response = await fetch(PROXY_URL, {
      method: 'GET',
      cache: 'no-store',
      headers: { 'Accept': 'text/html,application/xhtml+xml' }
    });

    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.text();
  }

  async function loadSite() {
    setStatus('Đang đồng bộ nội dung…');
    refreshBtn.disabled = true;

    try {
      const html = await fetchSource();
      const parser = new DOMParser();
      const sourceDoc = parser.parseFromString(html, 'text/html');

      disableDangerousDocumentFeatures(sourceDoc);
      rewriteAssetUrls(sourceDoc);
      replaceDocumentIdentity(sourceDoc);

      appEl.innerHTML = sourceDoc.body ? sourceDoc.body.innerHTML : html;

      // Nội dung được chèn cần thay thế lần nữa vì innerHTML chỉ lấy body.
      const liveWalker = document.createTreeWalker(appEl, NodeFilter.SHOW_TEXT);
      const liveNodes = [];
      while (liveWalker.nextNode()) liveNodes.push(liveWalker.currentNode);
      liveNodes.forEach(node => node.nodeValue = replaceAllText(node.nodeValue));

      // Không chạy JavaScript của website nguồn bên trong GitHub Pages.
      appEl.querySelectorAll('script').forEach(script => script.remove());

      document.title = SCHOOL_NAME;
      setStatus('Đã cập nhật lúc ' + new Date().toLocaleString('vi-VN'), false);
    } catch (error) {
      console.error(error);
      appEl.innerHTML = `
        <section id="error">
          <h2>Không thể đồng bộ website nguồn</h2>
          <p>Máy chủ proxy hoặc website nguồn hiện không phản hồi.</p>
          <p><a href="${SOURCE_URL}" target="_blank" rel="noopener">Mở website nguồn</a></p>
          <button type="button" id="retry">↻ Thử lại</button>
        </section>`;
      document.getElementById('retry')?.addEventListener('click', loadSite);
      setStatus('Đồng bộ thất bại — hãy thử lại.');
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', loadSite);
  loadSite();
})();
</script>
</body>
</html>
