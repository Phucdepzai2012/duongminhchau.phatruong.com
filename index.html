<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Trang đồng bộ nội dung cho Trường THCS Dương Minh Châu">
  <title>Trường THCS Dương Minh Châu</title>
  <style>
    html,body{margin:0;padding:0;background:#f5f7fa;font-family:Arial,sans-serif}
    #notice{position:sticky;top:0;z-index:99999;background:#0d3b66;color:#fff;padding:10px 16px;text-align:center;font-size:14px;line-height:1.5}
    #notice b{font-weight:800}
    #content{min-height:calc(100vh - 44px)}
    #loading{text-align:center;padding:70px 20px;color:#555}
  </style>
</head>
<body>
  <div id="notice"><b>TRƯỜNG THCS DƯƠNG MINH CHÂU</b> — Trang đồng bộ nội dung, không phải cổng chính thức của website nguồn.</div>
  <div id="content"><div id="loading">Đang tải nội dung…</div></div>
  <script>
    fetch('./synced.html?ts=' + Date.now(), {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(html => {
        document.getElementById('content').innerHTML = html;
        document.querySelectorAll('#content script').forEach(s => s.remove());
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<div style="max-width:760px;margin:70px auto;padding:24px;text-align:center"><h2>Chưa có dữ liệu đồng bộ</h2><p>GitHub Actions chưa tải được nội dung nguồn. Hãy chạy workflow <b>Sync website</b> trong tab Actions.</p><small>'+String(err)+'</small></div>';
      });
  </script>
</body>
</html>
